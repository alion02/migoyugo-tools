[package]
name = "itgo"
version = "0.1.0"
edition = "2024"

[dependencies]
erased-serde = "0.4.9"
multiptr = "0.3.0"
parking_lot = { version = "0.12.5", features = ["arc_lock", "send_guard"] }
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"] }
serde_json = "1.0.149"

[build-dependencies]
anyhow = { version = "1.0.101", default-features = false }
vergen-gitcl = { version = "9.1.0", default-features = false }
